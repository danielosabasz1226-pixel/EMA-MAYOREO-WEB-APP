plugins { id 'com.android.application' }

android {
    namespace 'com.ema.mayoreo'
    compileSdk 37

    defaultConfig {
        applicationId 'com.ema.mayoreo'
        minSdk 23
        targetSdk 37
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
        debug {
            debuggable false
        }
    }
}
