<!doctype html>
<html lang="es-GT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0B4EA2">
<title>EMA · Mayoreo</title>
<style>
body{margin:0;background:#f6f8fb;color:#101828;font-family:Arial,Segoe UI,sans-serif}
#boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
#boot strong{font-size:22px}#boot p{max-width:620px;line-height:1.5}
#err{white-space:pre-wrap;color:#b42318;margin-top:10px}
</style>
</head>
<body>
<div id="boot"><div><strong>Cargando EMA…</strong><p>Espera un momento mientras se carga la aplicación.</p><div id="err"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
(async()=>{
  const ZIP_NAME = 'EMA-MAYOREO-WEB-12.0-FORMATO-IMPRESION-PRO-LETRAS-GRANDES%20%282%29.zip';
  const showError = e => {
    document.getElementById('err').textContent = 'No se pudo cargar EMA.\n' + (e?.message || e);
    console.error(e);
  };
  try {
    if(!window.JSZip) throw new Error('No se pudo cargar JSZip.');
    const res = await fetch(ZIP_NAME, {cache:'no-store'});
    if(!res.ok) throw new Error('No se encontró el archivo ZIP publicado en GitHub.');
    const zip = await JSZip.loadAsync(await res.arrayBuffer());
    const names = Object.keys(zip.files);
    const find = suffix => names.find(n => !zip.files[n].dir && n.toLowerCase().endsWith('/'+suffix.toLowerCase())) || names.find(n => !zip.files[n].dir && n.toLowerCase()===suffix.toLowerCase());
    const indexPath = find('index.html');
    const cssPath = find('styles.css');
    const appPath = find('app.js');
    const xlsxPath = find('xlsx.full.min.js');
    const pdfPath = find('jspdf.umd.min.js');
    if(!indexPath || !cssPath || !appPath) throw new Error('Faltan archivos principales dentro del ZIP.');
    const html = await zip.file(indexPath).async('string');
    const doc = new DOMParser().parseFromString(html,'text/html');
    document.title = doc.title || 'EMA · Mayoreo';
    document.head.querySelectorAll('link[rel="icon"],link[rel="manifest"],link[rel="apple-touch-icon"]').forEach(e=>e.remove());
    document.body.innerHTML = doc.body.innerHTML;

    const css = await zip.file(cssPath).async('string');
    const style = document.createElement('style');
    style.textContent = css;
    document.head.appendChild(style);

    const runJs = async (path) => {
      const code = await zip.file(path).async('string');
      const s = document.createElement('script');
      s.textContent = code;
      document.body.appendChild(s);
    };

    if(xlsxPath){
      const code = await zip.file(xlsxPath).async('string');
      const s = document.createElement('script');
      s.textContent = code;
      document.head.appendChild(s);
      await new Promise(r=>setTimeout(r,0));

      // Limpieza global de datos importados desde Excel.
      // Se ejecuta antes de cargar app.js para que TODOS los flujos
      // de importación reciban los datos ya corregidos.
      if(window.XLSX && typeof window.XLSX.read === 'function'){
        const originalXLSXRead = window.XLSX.read;
        const LIMPIAR_CODIGO_CBC = /C[oó]d\.?\s*CBC[\s\S]*?AA[\w-]+/gi;

        const limpiarTexto = (valor) => {
          if(typeof valor !== 'string') return valor;
          return valor
            .replace(LIMPIAR_CODIGO_CBC, '')
            .replace(/[ \t]{2,}/g, ' ')
            .replace(/^[ \t]*[.\\-,:;|]+[ \t]*/g, '')
            .replace(/[ \t]*[.\\-,:;|]+[ \t]*$/g, '')
            .trim();
        };

        const limpiarCelda = (celda) => {
          if(!celda || typeof celda !== 'object') return;
          if(typeof celda.v === 'string') celda.v = limpiarTexto(celda.v);
          if(typeof celda.w === 'string') celda.w = limpiarTexto(celda.w);
          if(typeof celda.h === 'string') celda.h = limpiarTexto(celda.h);
        };

        const limpiarWorkbook = (wb) => {
          if(!wb || !wb.Sheets) return wb;

          for(const nombre of (wb.SheetNames || [])){
            const ws = wb.Sheets[nombre];
            if(!ws) continue;

            // Formato denso: !data contiene las filas y celdas.
            if(Array.isArray(ws['!data'])){
              for(const fila of ws['!data']){
                if(Array.isArray(fila)){
                  for(const celda of fila) limpiarCelda(celda);
                }
              }
            }

            // Formato normal: las celdas están indexadas por A1, B2, etc.
            for(const clave of Object.keys(ws)){
              if(!clave.startsWith('!')) limpiarCelda(ws[clave]);
            }
          }

          return wb;
        };

        window.XLSX.read = function(data, opts){
          return limpiarWorkbook(originalXLSXRead.call(this, data, opts));
        };
      }
    }
    if(pdfPath){
      const code = await zip.file(pdfPath).async('string');
      const s = document.createElement('script');
      s.textContent = code;
      document.head.appendChild(s);
      await new Promise(r=>setTimeout(r,0));
    }
    await runJs(appPath);
  } catch(e) {
    showError(e);
  }
})();
</script>
</body>
</html>
