<!doctype html>
<html lang="es-GT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0B4EA2">
<title>EMA · Mayoreo</title>
<style>
body{margin:0;background:#f6f8fb;color:#101828;font-family:Arial,Segoe UI,sans-serif}
#boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
#boot strong{font-size:22px}#boot p{max-width:620px;line-height:1.5}
#err{white-space:pre-wrap;color:#b42318;margin-top:10px}
</style>
</head>
<body>
<div id="boot"><div><strong>Cargando EMA…</strong><p>Espera un momento mientras se carga la aplicación.</p><div id="err"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
(async()=>{
  const ZIP_NAME = 'EMA-MAYOREO-WEB-12.0-FORMATO-IMPRESION-PRO-LETRAS-GRANDES%20%282%29.zip';
  const showError = e => {
    document.getElementById('err').textContent = 'No se pudo cargar EMA.\n' + (e?.message || e);
    console.error(e);
  };
  try {
    if(!window.JSZip) throw new Error('No se pudo cargar JSZip.');
    const res = await fetch(ZIP_NAME, {cache:'no-store'});
    if(!res.ok) throw new Error('No se encontró el archivo ZIP publicado en GitHub.');
    const zip = await JSZip.loadAsync(await res.arrayBuffer());
    const names = Object.keys(zip.files);
    const find = suffix => names.find(n => !zip.files[n].dir && n.toLowerCase().endsWith('/'+suffix.toLowerCase())) || names.find(n => !zip.files[n].dir && n.toLowerCase()===suffix.toLowerCase());
    const indexPath = find('index.html');
    const cssPath = find('styles.css');
    const appPath = find('app.js');
    const xlsxPath = find('xlsx.full.min.js');
    const pdfPath = find('jspdf.umd.min.js');
    if(!indexPath || !cssPath || !appPath) throw new Error('Faltan archivos principales dentro del ZIP.');
    const cleanProductText = (value) => {
      if (typeof value !== 'string') return value;
      let text = value.replace(/\u00A0/g, ' ').replace(/\s+/g, ' ').trim();
      text = text.replace(/(?:^|\s)Cód\.?\s*CBC\s*[-–—:]?\s*[^|;\n]*?\.[A-Z]{1,5}\d{4,}\s*$/i, '');
      text = text.replace(/\s*[-–—]\s*[^|;\n]*?\.[A-Z]{1,5}\d{4,}\s*$/i, '');
      text = text.replace(/\s*\(\s*[A-Z]{1,5}\d{4,}\s*\)\s*$/i, '');
      text = text.replace(/\s*\(?[A-Z]{1,5}\d{4,}\)?\s*$/i, '');
      return text.replace(/\s{2,}/g, ' ').trim();
    };

    const html = await zip.file(indexPath).async('string');
    const doc = new DOMParser().parseFromString(html,'text/html');
    document.title = doc.title || 'EMA · Mayoreo';
    document.head.querySelectorAll('link[rel="icon"],link[rel="manifest"],link[rel="apple-touch-icon"]').forEach(e=>e.remove());
    document.body.innerHTML = doc.body.innerHTML;

    const css = await zip.file(cssPath).async('string');
    const style = document.createElement('style');
    style.textContent = css;
    document.head.appendChild(style);

    const runJs = async (path) => {
      const code = await zip.file(path).async('string');
      const s = document.createElement('script');
      s.textContent = code;
      document.body.appendChild(s);
    };

    if(xlsxPath){
      const code = await zip.file(xlsxPath).async('string');
      const s = document.createElement('script');
      s.textContent = code;
      document.head.appendChild(s);
      await new Promise(r=>setTimeout(r,0));

      // Limpieza global de datos importados desde Excel.
      // Se ejecuta antes de cargar app.js para que TODOS los flujos
      // de importación reciban los datos ya corregidos.
      if(window.XLSX && typeof window.XLSX.read === 'function'){
        const originalXLSXRead = window.XLSX.read;
        const LIMPIAR_CODIGO_CBC = /C[oó]d\.?\s*CBC[\s\S]*?AA[\w-]+/gi;

        const limpiarTexto = (valor) => cleanProductText(valor);

        const limpiarCelda = (celda) => {
          if(!celda || typeof celda !== 'object') return;
          if(typeof celda.v === 'string') celda.v = limpiarTexto(celda.v);
          if(typeof celda.w === 'string') celda.w = limpiarTexto(celda.w);
          if(typeof celda.h === 'string') celda.h = limpiarTexto(celda.h);
        };

        const limpiarWorkbook = (wb) => {
          if(!wb || !wb.Sheets) return wb;

          for(const nombre of (wb.SheetNames || [])){
            const ws = wb.Sheets[nombre];
            if(!ws) continue;

            // Formato denso: !data contiene las filas y celdas.
            if(Array.isArray(ws['!data'])){
              for(const fila of ws['!data']){
                if(Array.isArray(fila)){
                  for(const celda of fila) limpiarCelda(celda);
                }
              }
            }

            // Formato normal: las celdas están indexadas por A1, B2, etc.
            for(const clave of Object.keys(ws)){
              if(!clave.startsWith('!')) limpiarCelda(ws[clave]);
            }
          }

          return wb;
        };

        window.XLSX.read = function(data, opts){
          return limpiarWorkbook(originalXLSXRead.call(this, data, opts));
        };
      }
    }
    if(pdfPath){
      const code = await zip.file(pdfPath).async('string');
      const s = document.createElement('script');
      s.textContent = code;
      document.head.appendChild(s);
      await new Promise(r=>setTimeout(r,0));
    }
    await runJs(appPath);

    // Barrera permanente: cualquier pedido que se renderice o se exporte
    // se limpia justo antes de usarse, incluso si viene de datos antiguos.
    const sanitizarEstadoEMA = () => {
      try {
        if (typeof state === 'undefined') return;
        if (Array.isArray(state.quotes)) {
          state.quotes.forEach(q => {
            if (!Array.isArray(q.items)) return;
            q.items.forEach(item => {
              item.codigo = '';
              item.descripcion = cleanProductText(item.descripcion || '');
            });
          });
        }
        if (Array.isArray(state.importHistory)) {
          state.importHistory.forEach(entry => {
            if (!Array.isArray(entry.preview)) return;
            entry.preview.forEach(q => {
              if (!Array.isArray(q.items)) return;
              q.items.forEach(item => {
                item.codigo = '';
                item.descripcion = cleanProductText(item.descripcion || '');
              });
            });
          });
        }
        if (typeof saveState === 'function') saveState();
      } catch (err) {
        console.warn('EMA: no se pudo limpiar el estado.', err);
      }
    };

    const protegerRenderYPDF = () => {
      try {
        sanitizarEstadoEMA();
        if (typeof renderQuote === 'function' && !renderQuote.__emaSafe) {
          const renderOriginal = renderQuote;
          const renderSeguro = function() {
            sanitizarEstadoEMA();
            return renderOriginal.apply(this, arguments);
          };
          renderSeguro.__emaSafe = true;
          renderQuote = renderSeguro;
        }
        if (typeof exportPdf === 'function' && !exportPdf.__emaSafe) {
          const pdfOriginal = exportPdf;
          const pdfSeguro = function(quote) {
            sanitizarEstadoEMA();
            const limpio = quote && typeof quote === 'object'
              ? {
                  ...quote,
                  items: Array.isArray(quote.items)
                    ? quote.items.map(item => ({
                        ...item,
                        codigo: '',
                        descripcion: cleanProductText(item.descripcion || '')
                      }))
                    : []
                }
              : quote;
            return pdfOriginal.call(this, limpio);
          };
          pdfSeguro.__emaSafe = true;
          exportPdf = pdfSeguro;
        }
        if (typeof renderQuote === 'function') renderQuote();
      } catch (err) {
        console.warn('EMA: no se pudieron proteger vista y PDF.', err);
      }
    };

    setTimeout(protegerRenderYPDF, 80);

    // Compatibilidad del selector de archivos:
    // EMA puede crear inputs dinámicamente. Quitamos filtros restrictivos
    // para que el explorador muestre todos los formatos de Excel.
    const prepararSelectoresExcel = () => {
      document.querySelectorAll('input[type="file"]').forEach(input => {
        input.removeAttribute('accept');
        input.setAttribute(
          'accept',
          '.xls,.xlsx,.xlsb,.csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv,*/*'
        );
      });
    };

    prepararSelectoresExcel();

    const emaStyle = document.createElement('style');
    emaStyle.textContent = `
      .cod { display:none !important; }
      @media (max-width:640px){
        .invoice { width:100% !important; }
        .items td:first-child { font-size: 1.05em; line-height:1.25; }
        .items td, .items th { padding:7px 6px !important; }
      }
      @media print {
        .cod { display:none !important; }
      }
    `;
    document.head.appendChild(emaStyle);


    document.addEventListener('click', (event) => {
      const input = event.target?.closest?.('input[type="file"]');
      if (input) {
        input.removeAttribute('accept');
        input.setAttribute(
          'accept',
          '.xls,.xlsx,.xlsb,.csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv,*/*'
        );
      }
    }, true);

    new MutationObserver(prepararSelectoresExcel).observe(document.documentElement, {
      subtree: true,
      childList: true
    });
  } catch(e) {
    showError(e);
  }
})();
</script>
</body>
</html>
