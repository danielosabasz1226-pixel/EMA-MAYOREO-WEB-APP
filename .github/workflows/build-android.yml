name: Compilar APK de EMA

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Compilar APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/EMA-Mayoreo.apk
          ls -lh dist/EMA-Mayoreo.apk

      - name: Publicar ZIP con solo el APK
        uses: actions/upload-artifact@v4
        with:
          name: EMA-Mayoreo-Android
          path: dist/EMA-Mayoreo.apk
          if-no-files-found: error
          retention-days: 30
