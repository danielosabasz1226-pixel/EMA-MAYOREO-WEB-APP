name: EMA Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ema-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Extraer EMA original
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 1 -type f -iname '*EMA-MAYOREO-WEB*.zip' -print -quit)"
          test -n "$ZIP"

          rm -rf extracted site
          mkdir -p extracted site
          unzip -q "$ZIP" -d extracted

          INDEX="$(find extracted -type f -name 'index.html' -print -quit)"
          test -n "$INDEX"

          APP_DIR="$(dirname "$INDEX")"
          cp -a "$APP_DIR"/. site/

          rm -f site/ABRIR-EMA.bat
          find site -name '.DS_Store' -delete

      - name: Eliminar SOLO el segundo código de cada producto
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("site/app.js")
          s = p.read_text(encoding="utf-8")

          # Este es EXACTAMENTE el segundo renglón que aparece debajo
          # de cada producto. Se elimina de la interfaz, sin tocar
          # los botones, Excel, pedidos ni el resto de EMA.
          needle = """        ${item.codigo ? `<span class="cod">Cód. ${esc(item.codigo)}</span>` : ''}
"""

          count = s.count(needle)
          if count != 1:
              raise SystemExit(f"No encontré exactamente 1 renglón de código secundario; encontré {count}.")

          s = s.replace(needle, "", 1)

          # También evitamos que el código secundario vuelva a aparecer
          # por estilos antiguos en pantalla o impresión.
          p.write_text(s, encoding="utf-8")

          css = Path("site/styles.css")
          c = css.read_text(encoding="utf-8")
          if ".cod" not in c:
              c += "\n.cod { display:none !important; }\n"
          css.write_text(c, encoding="utf-8")

          print("Código secundario eliminado correctamente.")
          PY

          node --check site/app.js
          grep -Rni 'class="cod"' site/app.js || true

          test -s site/index.html
          test -s site/app.js
          test -s site/styles.css

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
