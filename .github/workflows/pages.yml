name: EMA Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ema-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar EMA original
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 1 -type f -iname '*EMA-MAYOREO-WEB*.zip' -print -quit)"
          test -n "$ZIP"

          rm -rf extracted site
          mkdir -p extracted site
          unzip -q "$ZIP" -d extracted

          INDEX="$(find extracted -type f -name 'index.html' -print -quit)"
          test -n "$INDEX"

          APP_DIR="$(dirname "$INDEX")"
          cp -a "$APP_DIR"/. site/

          rm -f site/ABRIR-EMA.bat
          find site -name '.DS_Store' -delete

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("site/app.js")
          s = p.read_text(encoding="utf-8")

          s = s.replace(
              "codigo: item.code, descripcion: item.name,",
              "codigo: '', descripcion: item.name,"
          )

          s = s.replace(
              "codigo: cleanText(item.codigo),",
              "codigo: '',"
          )

          pattern = r'^\s*\$\{item\.codigo.*class="cod".*\}\s*$'
          s, removed = re.subn(pattern, '', s, count=1, flags=re.MULTILINE)
          if removed != 1:
              raise SystemExit("No encontré el renglón del código secundario.")

          p.write_text(s, encoding="utf-8")

          css = Path("site/styles.css")
          c = css.read_text(encoding="utf-8")
          if ".cod { display: none !important; }" not in c:
              c += "\n.cod { display:none !important; }\n"
          css.write_text(c, encoding="utf-8")
          PY

          node --check site/app.js
          test -s site/index.html
          test -s site/app.js
          test -s site/styles.css

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
