name: Publicar EMA en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Extraer aplicación EMA
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$ZIP"
          rm -rf site
          mkdir -p site
          unzip -q "$ZIP" -d extracted

          INDEX="$(find extracted -type f -name 'index.html' -print -quit)"
          test -n "$INDEX"

          APP_DIR="$(dirname "$INDEX")"
          cp -a "$APP_DIR"/. site/

          test -f site/index.html
          test -f site/app.js
          test -f site/styles.css

          rm -f site/ABRIR-EMA.bat
          find site -name '.DS_Store' -delete

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
